apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-radar
spec:
  replicas: 3
  selector:
    matchLabels:
      app: price-radar
  template:
    metadata:
      labels:
        app: price-radar
    spec:
      containers:
        - name: price-radar
          image: price-radar-ai:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: price-radar-config
          volumeMounts:
            - name: app-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: app-data
          emptyDir: {}
